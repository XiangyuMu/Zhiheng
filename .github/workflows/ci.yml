name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
          restic version
          echo "ZHIHENG_RESTIC_BINARY=$(command -v restic)" >> "$GITHUB_ENV"

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        if: ${{ !cancelled() }}
        run: uv run mypy src tests

      - name: Complete pytest delivery gate
        if: ${{ !cancelled() }}
        run: uv run python scripts/pytest_delivery_gate.py --output "$RUNNER_TEMP/pytest-delivery" --timeout 7200

      - name: Preserve pytest delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/pytest-delivery/
          if-no-files-found: warn
