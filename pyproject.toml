[project]
name = "zhiheng"
version = "0.1.0"
description = "Single-user self-evolving personal knowledge agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13.3,<2.0",
  "argon2-cffi>=23.1.0,<24.0",
  "fastapi>=0.115.0,<1.0",
  "httpx>=0.27.2,<1.0",
  "jieba>=0.42.1,<0.43",
  "openai>=2.0.0,<3.0",
  "presidio-analyzer>=2.2.364,<2.3.0",
  "pypdf>=5.0.0,<6.0",
  "jsonschema>=4.23.0,<5.0",
  "pydantic>=2.9.0,<3.0",
  "sqlite-vec==0.1.9",
  "pydantic-settings>=2.5.0,<3.0",
  "sqlalchemy>=2.0.35,<3.0",
  "structlog>=24.4.0,<25.0",
  "uvicorn[standard]>=0.30.6,<1.0",
]

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers>=6.0.1,<7.0",
]
dev = [
  "mypy>=1.11.2,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0.0,<6.0",
  "ruff>=0.6.8,<1.0",
]

[project.scripts]
zhiheng-api = "zhiheng.api.main:run"
zhiheng-worker = "zhiheng.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiheng"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/retrieval/benchmark.py" = ["E501"]
# Dense SQL statements are kept readable as SQL; Python structure remains formatted.
"src/zhiheng/api/knowledge_workspace.py" = ["E501"]
"src/zhiheng/evaluation/g006_runner.py" = ["E501"]
"src/zhiheng/events/repository.py" = ["E501"]
"src/zhiheng/evolution/maintenance_runtime.py" = ["E501"]
"src/zhiheng/jobs/memory_extraction.py" = ["E501"]
"src/zhiheng/knowledge/pdf_repository.py" = ["E501"]
"src/zhiheng/privacy/erase.py" = ["E501"]
"src/zhiheng/retrieval/authorization.py" = ["E501"]
"tests/integration/test_answer_replay_authority.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
