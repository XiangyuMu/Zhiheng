services:
  caddy:
    image: docker.m.daocloud.io/library/caddy:2.10-alpine
    environment:
      ZHIHENG_SITE_ADDRESS: ${ZHIHENG_SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      ZHIHENG_ENVIRONMENT: production
      ZHIHENG_DATABASE_URL: sqlite:////data/zhiheng.db
      ZHIHENG_SECRET_KEY: ${ZHIHENG_SECRET_KEY:?ZHIHENG_SECRET_KEY must be set}
      ZHIHENG_BOOTSTRAP_TOKEN: ${ZHIHENG_BOOTSTRAP_TOKEN:?ZHIHENG_BOOTSTRAP_TOKEN must be set}
      ZHIHENG_ERASE_JOURNAL_PATH: /data/erase-journal.jsonl
      ZHIHENG_KNOWLEDGE_OBJECT_STORE_PATH: /data/knowledge-object-store
      ZHIHENG_PDF_PARSER_BACKEND: ${ZHIHENG_PDF_PARSER_BACKEND:-mineru}
      ZHIHENG_API_HOST: 0.0.0.0
    volumes:
      - zhiheng-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      ZHIHENG_ENVIRONMENT: production
      ZHIHENG_DATABASE_URL: sqlite:////data/zhiheng.db
      ZHIHENG_SECRET_KEY: ${ZHIHENG_SECRET_KEY:?ZHIHENG_SECRET_KEY must be set}
      ZHIHENG_BOOTSTRAP_TOKEN: ${ZHIHENG_BOOTSTRAP_TOKEN:?ZHIHENG_BOOTSTRAP_TOKEN must be set}
      ZHIHENG_ERASE_JOURNAL_PATH: /data/erase-journal.jsonl
      ZHIHENG_KNOWLEDGE_OBJECT_STORE_PATH: /data/knowledge-object-store
      ZHIHENG_PDF_PARSER_BACKEND: ${ZHIHENG_PDF_PARSER_BACKEND:-mineru}
      ZHIHENG_WORKER_ROLE: worker
      ZHIHENG_PDF_DEEPDOC_URL: http://deepdoc-worker:9390
      ZHIHENG_PDF_MINERU_URL: http://mineru-gateway:9392
      ZHIHENG_PDF_DEEPDOC_TOKEN_FILE: /run/secrets/deepdoc_service_token
      ZHIHENG_PDF_MINERU_TOKEN_FILE: /run/secrets/mineru_service_token
    volumes:
      - zhiheng-data:/data
      - ${DEEPDOC_SERVICE_TOKEN_FILE:-/dev/null}:/run/secrets/deepdoc_service_token:ro
    secrets:
      - mineru_service_token
    command: ["zhiheng-worker", "--role", "worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  publisher-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      ZHIHENG_ENVIRONMENT: production
      ZHIHENG_DATABASE_URL: sqlite:////data/zhiheng.db
      ZHIHENG_SECRET_KEY: ${ZHIHENG_SECRET_KEY:?ZHIHENG_SECRET_KEY must be set}
      ZHIHENG_BOOTSTRAP_TOKEN: ${ZHIHENG_BOOTSTRAP_TOKEN:?ZHIHENG_BOOTSTRAP_TOKEN must be set}
      ZHIHENG_ERASE_JOURNAL_PATH: /data/erase-journal.jsonl
      ZHIHENG_KNOWLEDGE_OBJECT_STORE_PATH: /data/knowledge-object-store
      ZHIHENG_PDF_PARSER_BACKEND: ${ZHIHENG_PDF_PARSER_BACKEND:-mineru}
      ZHIHENG_WORKER_ROLE: publisher
      ZHIHENG_PDF_DEEPDOC_URL: http://deepdoc-worker:9390
      ZHIHENG_PDF_MINERU_URL: http://mineru-gateway:9392
      ZHIHENG_PDF_DEEPDOC_TOKEN_FILE: /run/secrets/deepdoc_service_token
      ZHIHENG_PDF_MINERU_TOKEN_FILE: /run/secrets/mineru_service_token
    volumes:
      - zhiheng-data:/data
      - ${DEEPDOC_SERVICE_TOKEN_FILE:-/dev/null}:/run/secrets/deepdoc_service_token:ro
    secrets:
      - mineru_service_token
    command: ["zhiheng-worker", "--role", "publisher"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  mineru-gateway:
    profiles: ["pdf"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ZHIHENG_KNOWLEDGE_OBJECT_STORE_PATH: /data/knowledge-object-store
      MINERU_GATEWAY_STATE_PATH: /data/mineru-gateway.sqlite3
      MINERU_UPSTREAM_URL: http://mineru-worker:9391
      MINERU_GATEWAY_TOKEN_FILE: /run/secrets/mineru_service_token
      MINERU_GATEWAY_HOST: 0.0.0.0
      MINERU_GATEWAY_PORT: 9392
    volumes:
      - zhiheng-data:/data
    secrets:
      - mineru_service_token
    command: ["python", "deploy/pdf-parser/mineru_gateway.py"]
    ports:
      - "127.0.0.1:9392:9392"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9392/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      mineru-worker:
        condition: service_started
  deepdoc-worker:
    profiles: ["deepdoc"]
    image: deepdoc_oss:local
    build:
      context: ..
      dockerfile: deploy/pdf-parser/Dockerfile.deepdoc
    expose:
      - "9390"
    environment:
      DEEPDOC_SERVICE_TOKEN_FILE: /run/secrets/deepdoc_service_token
    volumes:
      - ${DEEPDOC_SERVICE_TOKEN_FILE:-/dev/null}:/run/secrets/deepdoc_service_token:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=2g,noexec,nosuid,nodev
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 256
    restart: unless-stopped
  mineru-worker:
    profiles: ["pdf"]
    image: mineru:local
    build:
      context: ..
      dockerfile: deploy/pdf-parser/Dockerfile.mineru
    expose:
      - "9391"
    environment:
      MINERU_SERVICE_TOKEN_FILE: /run/secrets/mineru_service_token
      HOME: /opt/mineru-models
      MINERU_MODEL_SOURCE: local
      MINERU_TOOLS_CONFIG_JSON: /opt/mineru-models/mineru.json
      MINERU_API_OUTPUT_ROOT: /var/lib/mineru/output
    volumes:
      - mineru-models:/opt/mineru-models
      - mineru-output:/var/lib/mineru
    secrets:
      - mineru_service_token
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=2g,noexec,nosuid,nodev
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 256
    restart: unless-stopped
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:0.11.10
    profiles: ["local-model"]
    network_mode: "service:api"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
volumes:
  zhiheng-data:
  caddy-data:
  caddy-config:
  ollama-data:
  mineru-models:
  mineru-output:
secrets:
  mineru_service_token:
    file: ${MINERU_SERVICE_TOKEN_FILE:-../var/secrets/mineru_service_token}
